<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>CIA</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="terminal">
    <span class="visually-hidden" id="connection-label" aria-live="polite">Mac接続を確認中</span>

    <section class="stage home-stage" id="home-screen" aria-label="プリンター ホーム">
      <button class="home-action" id="home-action" type="button" aria-label="プリンターを使用する">
        <span class="home-icon material-symbols-rounded" aria-hidden="true">print</span>
        <span class="home-label">プリンター</span>
        <span class="home-hint">タップして開始</span>
      </button>
    </section>

    <section class="stage notice-stage" id="lock-notice-screen" hidden aria-live="polite">
      <span class="hero-icon material-symbols-rounded" aria-hidden="true">lock</span>
      <p>ロックがかかっています</p>
    </section>

    <section class="stage" id="lock-screen" hidden aria-label="パスワード認証">
      <span class="hero-icon material-symbols-rounded" aria-hidden="true">lock</span>
      <form class="auth-panel" id="auth-form">
        <label class="visually-hidden" for="password">パスワード</label>
        <input id="password" name="password" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="auth-message" placeholder="パスワード">
        <button type="submit" aria-label="認証する"><span class="material-symbols-rounded" aria-hidden="true">check_circle</span></button>
        <p class="form-message" id="auth-message" aria-live="polite"></p>
        <div class="auth-progress" aria-hidden="true"><i></i></div>
      </form>
    </section>

    <section class="stage release-stage" id="release-screen" hidden aria-label="印刷">
      <span class="hero-icon success material-symbols-rounded" aria-hidden="true">description</span>
      <button class="print-button" id="print-button" type="button"><span class="material-symbols-rounded" aria-hidden="true">print</span><span>印刷</span></button>
    </section>

    <section class="result-layer" id="result-layer" hidden aria-live="assertive">
      <div class="result-card" id="result-card">
        <div class="result-symbol" id="result-symbol" aria-hidden="true"><span class="material-symbols-rounded">print</span></div>
        <p class="result-kicker" id="result-kicker">SENDING</p>
        <h1 id="result-title">送信中</h1>
        <p id="result-detail">そのままお待ちください。</p>
        <div class="send-progress" id="send-progress"><i></i></div>
        <button class="quiet-button" id="result-action" type="button" hidden><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span><span>戻る</span></button>
        <p class="countdown" id="countdown"></p>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
