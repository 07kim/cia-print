<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>CIA Print 管理</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div><p class="eyebrow">LOCAL PRINT RELAY</p><h1>印刷端末 管理</h1></div>
      <a class="participant-link" href="/"><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>参加者画面</a>
    </header>

    <div id="dashboard">
      <section class="status" aria-label="接続状態">
        <span class="material-symbols-rounded status-icon" aria-hidden="true">wifi</span>
        <div><strong>ローカル印刷サーバー</strong><small id="status-copy">状態を確認中</small></div>
      </section>
      <div class="settings-layout">
        <section class="settings-section">
          <div class="section-heading"><span class="material-symbols-rounded" aria-hidden="true">settings</span><div><p class="eyebrow">SETTINGS</p><h2>端末設定</h2></div></div>
          <form id="settings-form" class="fields">
            <label>参加者パスワード<input id="access-password" required></label>
            <label>プリンター名<input id="printer-name" required></label>
            <label>印刷後に戻る秒数<input id="reset-seconds" type="number" min="5" max="300" required></label>
            <label>連続印刷の待機秒数<input id="cooldown-seconds" type="number" min="0" max="300" required></label>
            <button type="submit"><span class="material-symbols-rounded" aria-hidden="true">check_circle</span>設定を保存</button>
          </form>
        </section>
        <section class="settings-section document-section">
          <div class="section-heading"><span class="material-symbols-rounded" aria-hidden="true">description</span><div><p class="eyebrow">DOCUMENT</p><h2>印刷資料</h2></div></div>
          <p class="document-name"><span>現在の資料</span><strong id="document-name">-</strong></p>
          <form id="upload-form" class="upload">
            <label>差し替える写真またはPDF<input id="document-file" type="file" accept="application/pdf,image/png,image/jpeg" required></label>
            <button type="submit"><span class="material-symbols-rounded" aria-hidden="true">upload_file</span>印刷資料を差し替える</button>
          </form>
          <div class="reprint-area">
            <div><h3>管理者再印刷</h3><p>現在の固定資料を1部送信します。</p></div>
            <button class="secondary" id="reprint" type="button"><span class="material-symbols-rounded" aria-hidden="true">print</span>再印刷する</button>
          </div>
        </section>
      </div>
      <p class="message dashboard-message" id="dashboard-message" aria-live="polite"></p>
    </div>
  </main>
  <script src="/admin/admin.js"></script>
</body>
</html>
