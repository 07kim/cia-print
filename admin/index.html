<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CIA Print 管理</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <main class="shell">
    <header><div><small>LOCAL PRINT RELAY</small><h1>印刷端末 管理</h1></div><a href="/">参加者画面</a></header>
    <section class="login card" id="login">
      <h2>管理者PIN</h2>
      <form id="login-form"><input id="pin" type="password" inputmode="numeric" autocomplete="off"><button>開く</button></form>
      <p id="login-message" class="message"></p>
    </section>
    <div id="dashboard" hidden>
      <section class="status card"><span class="lamp"></span><div><strong>ローカル印刷サーバー</strong><small id="status-copy">状態を確認中</small></div></section>
      <div class="grid">
        <section class="card">
          <small>SETTINGS</small><h2>端末設定</h2>
          <form id="settings-form" class="fields">
            <label>参加者パスワード<input id="access-password" required></label>
            <label>プリンター名<input id="printer-name" required></label>
            <label>印刷後に戻る秒数<input id="reset-seconds" type="number" min="5" max="300" required></label>
            <label>連続印刷の待機秒数<input id="cooldown-seconds" type="number" min="0" max="300" required></label>
            <label>新しい管理者PIN（変更時のみ）<input id="new-pin" type="password" inputmode="numeric"></label>
            <button>設定を保存</button>
          </form>
        </section>
        <section class="card">
          <small>DOCUMENT</small><h2>印刷資料</h2>
          <p class="document-name">現在: <strong id="document-name">-</strong></p>
          <form id="upload-form" class="upload">
            <label>差し替えるPDF<input id="document-file" type="file" accept="application/pdf" required></label>
            <button>PDFを差し替える</button>
          </form>
          <hr>
          <h3>管理者再印刷</h3>
          <p>現在の固定資料を1部送信します。</p>
          <button class="secondary" id="reprint" type="button">再印刷する</button>
        </section>
      </div>
      <p class="message" id="dashboard-message" aria-live="polite"></p>
    </div>
  </main>
  <script src="/admin/admin.js"></script>
</body>
</html>
